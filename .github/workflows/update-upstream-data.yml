name: Update upstream data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. Minute 00 UTC is also minute 00 in JST.
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect authorized upstream data
        env:
          MM_UPSTREAM_API_BASE: https://api.mentemori.icu
          MM_LEGEND_LEAGUE_CSV_URL: https://docs.google.com/spreadsheets/d/15bxBeoWfO4R1b1u5OlohpwCsZLmWEUOaXwrsT9h0eYg/export?format=csv&gid=0
          MM_REGION: jp
          MM_AUTHORIZED_UPSTREAM_URL: ${{ secrets.MM_AUTHORIZED_UPSTREAM_URL }}
          MM_UPSTREAM_BEARER_TOKEN: ${{ secrets.MM_UPSTREAM_BEARER_TOKEN }}
        run: npm run collect

      - name: Publish latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "chore: update latest upstream data"
          git push
