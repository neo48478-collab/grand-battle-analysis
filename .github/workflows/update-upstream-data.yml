name: Update upstream data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. Minute 00 UTC is also minute 00 in JST.
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect authorized upstream data
        env:
          MM_AUTHORIZED_UPSTREAM_URL: ${{ secrets.MM_AUTHORIZED_UPSTREAM_URL }}
          MM_UPSTREAM_BEARER_TOKEN: ${{ secrets.MM_UPSTREAM_BEARER_TOKEN }}
        run: |
          if [ -z "$MM_AUTHORIZED_UPSTREAM_URL" ]; then
            echo "MM_AUTHORIZED_UPSTREAM_URL is not configured yet; skipping this hourly update."
            exit 0
          fi
          npm run collect

      - name: Publish latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "chore: update latest upstream data"
          git push
